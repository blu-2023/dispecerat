<!doctype html>
<html><head><meta charset="utf-8"><title>Dispecerat</title>
<style>body{background:#0b0f17;color:#e5e7eb;font-family:system-ui,sans-serif;margin:0;padding:48px;text-align:center}
.box{max-width:560px;margin:0 auto;padding:24px;border:1px solid #374151;border-radius:12px;background:#111827}
code{background:#000;padding:2px 6px;border-radius:4px;color:#93c5fd}</style></head>
<body>
<div class="box">
  <h1>Dispecerat — consola indisponibilă</h1>
  <p>Aplicația web nu răspunde la <code id="u">http://192.168.1.100:3000</code>.</p>
  <p>Verifică:</p>
  <ul style="text-align:left;display:inline-block">
    <li><code>npm run dev</code> rulează în /root/dispecerat</li>
    <li>Conexiunea de rețea către server</li>
    <li>Firewall pe portul 3000</li>
  </ul>
  <p style="margin-top:24px;color:#6b7280">Reîncarcă fereastra cu Ctrl+R când e gata.</p>
</div>
<script>document.getElementById('u').textContent=location.href||'http://192.168.1.100:3000'</script>
</body></html>
