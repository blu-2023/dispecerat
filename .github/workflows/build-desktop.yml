name: Build Desktop (Windows)

# Builds the Dispecerat Electron desktop app for Windows (NSIS installer).
# Triggers:
#   - manual: from the Actions tab → "Run workflow"
#   - tag push: any `v*` tag (e.g. v0.1.0) → also creates a GitHub Release with the installer attached
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # required to attach assets to releases

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        run: npm ci || npm install

      - name: Build Windows installer (NSIS)
        env:
          # electron-builder reads this to download from GitHub mirrors
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispecerat-windows-setup
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          fail_on_unmatched_files: true
